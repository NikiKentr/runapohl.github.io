<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon.png">
    <meta name="msapplication-TileImage" content="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Runa Pohl - Artist and Illustrator based in Schwäbisch Hall, Germany. Showcasing illustrations, zines, and original artwork.">
    <meta name="keywords" content="Runa Pohl, artist, illustrator, zines">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Barlow', sans-serif;
            background: white;
            overflow: hidden; /* Prevent scrolling */
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            height: 100vh; /* Full viewport height */
            overflow: hidden; /* Prevent internal scrolling */
        }
        
        .logo {
            margin-bottom: 60px;
        }
        
        .logo.inactive {
            opacity: 1 !important;
        }
        
        
        .logo img {
            width: 120px;
            height: auto;
        }
        
        .featured-image {
            max-width: 65%;
            transition: opacity 0.3s ease;
        }
        
        .featured-image.inactive {
            cursor: default;
            opacity: 1 !important;
        }
        
        
        .featured-image img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        .menu {
            margin-top: 30px;
            opacity: 0;
            visibility: visible; /* Change to visible by default */
            transition: opacity 0.6s ease;
            margin-bottom: 40px;
        }
        
        .menu.visible {
            opacity: 1;
        }
        
        .menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 40px;
        }
        
        .menu ul li a {
            text-decoration: none;
            color: #dd5030;
            font-size: 1.5rem;
            font-weight: normal;
            transition: all 0.3s ease;
        }
        
        .menu ul li a:hover {
            color: #f4a195;
        }

        .copyright-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: white;
            text-align: center;
            font-size: 0.7rem;
            padding: 5px 0;
            font-family: 'Barlow', sans-serif;
            color: #666;
            z-index: 1000;
        }
        
        @media (max-width: 768px) {
            body, html {
                overflow: hidden; /* Prevent scrolling */
            }
            
            .container {
                justify-content: center;
                padding: 0 20px;
            }
            
            .logo {
                margin-bottom: 20px; /* Reduced from 60px */
            }
            
            .logo img {
                width: 80px; /* Reduced from 120px */
            }
            
            .menu {
                margin-top: 15px; /* Reduced from 30px */
                margin-bottom: 20px; /* Reduced from 40px */
            }
            
            .menu ul {
                flex-direction: column;
                align-items: center;
                gap: 3px; /* Very small gap for mobile */
            }
            
            .featured-image {
                width: 90%;
                max-width: 600px;
            }
            
            .menu ul li a {
                font-size: 1.2rem;
                display: block;
                padding: 3px 0;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .featured-image {
                width: 95%;
                max-width: 400px;
            }
            
            .menu ul li a {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" id="logo">
            <img src="images/logo.png" alt="RUNA POHL">
        </div>
        
        <nav class="menu" id="menu">
            <ul>
                <li><a href="about.html">Über mich</a></li>
                <li><a href="illustrations.html">Illustrationen</a></li>
                <li><a href="zines.html">Zines</a></li>
                <li><a href="originale.html">Originale</a></li>
                <li><a href="ausstellungen.html">Ausstellungen</a></li>
                <li><a href="contact.html">Kontakt</a></li>
                <li><a href="shop.html">Shop</a></li>
            </ul>
        </nav>
        
        <div class="featured-image" id="featuredImage">
            <img src="images/featured-image.jpg" alt="RUNA POHL Featured Work">
        </div>

        <footer class="copyright-footer">
            © 2025 Runa Pohl. All Rights Reserved.
        </footer>
    </div>

    <script>
        // Prevent right-click context menu
        document.addEventListener('contextmenu', function(e) { 
            e.preventDefault(); 
        }, false);

        // Prevent scrolling
        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const logo = document.getElementById('logo');
            const featuredImage = document.getElementById('featuredImage');
            const menu = document.getElementById('menu');
    
            // Set a timeout to show the menu automatically after page load
            setTimeout(function() {
                menu.classList.add('visible');
                
                
            }, 1500); // 1.5 second delay before starting the fade
        });
    </script>
</body>
</html>
